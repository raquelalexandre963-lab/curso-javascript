<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>Aula JS</title>
</head>
<body>
  <div id="exibe_resultado">Resultado da Multiplicação: </div>
  <script>
    var resultado = 10 * 100;

    var divLocal = document.getElementById('exibe_resultado');
    divLocal.innerHTML += resultado;
  </script>
</body>
</html>
