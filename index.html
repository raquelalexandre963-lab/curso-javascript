<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>Calculadora de IMC - Estácio</title>
  </head>
  <body class="bg-light">
    <div class="container py-5">
      <div class="row justify-content-center">
        <div class="col-md-6">
          <div class="card shadow">
            <div class="card-body p-4">
              <h1 class="h3 mb-3">Calculadora de IMC</h1>
              <p class="text-muted">Tema 5 - Linguagem JavaScript - Estruturas Condicionais</p>
              
              <label class="form-label">Peso (Kg)</label>
              <input type="number" id="peso" class="form-control mb-3" placeholder="Ex: 70">
              
              <label class="form-label">Altura (m)</label>
              <input type="number" id="altura" class="form-control mb-3" step="0.01" placeholder="Ex: 1.75">

              <button id="popoverButton" type="button" class="btn btn-primary btn-lg w-100" data-bs-toggle="popover" title="Resultado" data-bs-content="Preencha os dados">
                Executar
              </button>
              
              <div id="resultado" class="alert alert-info mt-3 d-none"></div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script async src="https://cdn.jsdelivr.net/npm/es-module-shims@1/dist/es-module-shims.min.js" crossorigin="anonymous"></script>
    <script type="importmap">
    {
      "imports": {
        "@popperjs/core": "https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/esm/popper.min.js",
        "bootstrap": "https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.esm.min.js"
      }
    }
    </script>
    
    <!-- SEU ARQUIVO DA ESTÁCIO -->
    <script src="calculoIMC.js"></script>

    <script type="module">
      import * as bootstrap from 'bootstrap'

      const popoverEl = document.getElementById('popoverButton');
      const popover = new bootstrap.Popover(popoverEl);
      const resultadoDiv = document.getElementById('resultado');

      popoverEl.addEventListener('click', () => {
        const peso = parseFloat(document.getElementById('peso').value);
        const altura = parseFloat(document.getElementById('altura').value);

        if (!peso || !altura) {
          popoverEl.setAttribute('data-bs-content', 'Preencha peso e altura!');
          popover.show();
          return;
        }

        const valor = imc(peso, altura);
        const sit = situacao(valor);
        const texto = `IMC ${valor.toFixed(2)} : Situação: ${sit}`;

        // Mostra no popover estilo do seu template
        popoverEl.setAttribute('data-bs-content', texto);
        popover.show();
        
        // E mostra também na tela
        resultadoDiv.textContent = texto;
        resultadoDiv.classList.remove('d-none');

        // Mantém o alert original que o professor pede no vídeo
        // alert(texto); // descomenta se quiser igualzinho ao print
      });
    </script>
  </body>
</html>
