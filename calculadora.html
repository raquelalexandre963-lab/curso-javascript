<!doctype html>
<html lang="pt-br">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
<title>Calculadora de IMC - Estácio</title>
</head>
<body class="bg-light">
<div class="container py-5">
<div class="col-md-6 mx-auto">
<div class="card shadow p-4">
<h3>Calculadora de IMC</h3>
<input type="number" id="peso" class="form-control mb-3" placeholder="Peso Ex: 70">
<input type="number" id="altura" class="form-control mb-3" step="0.01" placeholder="Altura Ex: 1.75">
<button id="btn" class="btn btn-primary w-100">Executar</button>
<div id="res" class="alert alert-info mt-3 d-none"></div>
</div></div></div>
<script>
const imc=(p,a)=>p/(a*a);
const situacao=v=>v<18.5?"Abaixo do peso":v<25?"Peso ideal (parabéns)":v<30?"Levemente acima do peso":v<35?"Obesidade de grau I":v<40?"Obesidade de grau II (severa)":"Obesidade de grau III (mórbida)";
document.getElementById('btn').onclick=()=>{
let p=parseFloat(peso.value),a=parseFloat(altura.value),r=document.getElementById('res');
if(!p||!a){r.textContent="Preencha peso e altura";r.classList.remove('d-none');return;}
let v=imc(p,a);r.textContent=`IMC ${v.toFixed(2)} : Situação: ${situacao(v)}`;r.classList.remove('d-none');
}
</script>
</body>
</html>
